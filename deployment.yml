apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-store-app
  labels:
    app: medical-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-store
  template:
    metadata:
      labels:
        app: medical-store
    spec:
      containers:
        - name: medical-store-container
          image: pshuser/med:latest  # Replace with your Docker image
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
               name: backend-secret
      imagePullSecrets:
             - name: regcred
      
           


 